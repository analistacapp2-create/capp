<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<header id="mg-header" class="mg-header">
  <input type="checkbox" id="mg-toggle" class="mg-toggle" aria-hidden="true" tabindex="-1" />
  <div class="mg-bar">
    <a href="https://marketing.agenciacapp.com.br/magma" class="mg-logo" aria-label="Magma Geologia e Meio Ambiente - página inicial">
      <span class="mg-logo-mark" aria-hidden="true"></span>
      <img
        class="mg-logo-name"
        src="https://files.greatpages.com.br/images/67944/PkbnZzojMLpI4Mzl5XrGuCkK.webp"
        alt="Magma Geologia e Meio Ambiente"
        width="521"
        height="94"
      />
    </a>
    <nav class="mg-nav" aria-label="Menu principal">
      <a href="https://marketing.agenciacapp.com.br/magma#mg-solucoes">Serviços</a>
      <a href="https://marketing.agenciacapp.com.br/magma#mg-projetos">Projetos</a>
      <a href="https://marketing.agenciacapp.com.br/magma/sobre">Sobre</a>
      <a href="https://marketing.agenciacapp.com.br/magma#mg-clientes">Clientes</a>
      <a href="https://marketing.agenciacapp.com.br/magma/contato">Contatos</a>
    </nav>
    <label for="mg-toggle" class="mg-burger" aria-label="Abrir menu"> <span></span><span></span><span></span> </label>
  </div>
  <nav class="mg-mobile" aria-label="Menu">
    <a href="https://marketing.agenciacapp.com.br/magma#mg-solucoes">Serviços</a>
    <a href="https://marketing.agenciacapp.com.br/magma#mg-projetos">Projetos</a>
    <a href="https://marketing.agenciacapp.com.br/magma/sobre">Sobre</a>
    <a href="https://marketing.agenciacapp.com.br/magma#mg-clientes">Clientes</a>
    <a href="https://marketing.agenciacapp.com.br/magma/contato">Contatos</a>
  </nav>
</header>
<style>
  #mg-header {
    --mg-bg: rgba(246, 245, 240, 0.78);
    --mg-bg-solid: #f6f5f0;
    --mg-text: #1f2a22;
    --mg-green: #6d9a38;
    --mg-green-dark: #4e7329;
    --mg-blue: #486ba3;
    --mg-orange: #bf5e20;
    --mg-bar-h: 62px;
    --mg-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    font-family: "Manrope", "Segoe UI", Arial, sans-serif;
    font-weight: 700;
  }
  #mg-header *,
  #mg-header *::before,
  #mg-header *::after {
    box-sizing: border-box;
  }
  #mg-header a {
    text-decoration: none !important;
  }
  #mg-header .mg-toggle {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  #mg-header .mg-bar {
    position: relative;
    z-index: 2;
    height: var(--mg-bar-h);
    background: var(--mg-bg);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    backdrop-filter: blur(12px) saturate(140%);
    border-bottom: 1px solid rgba(31, 42, 34, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 0 max(24px, calc((100% - 1160px) / 2));
    transition:
      height 0.45s var(--mg-ease),
      background-color 0.45s var(--mg-ease),
      box-shadow 0.45s var(--mg-ease);
  }
  #mg-header .mg-nav {
    display: flex;
    align-items: center;
    gap: clamp(22px, 3.4vw, 44px);
  }
  #mg-header .mg-nav a,
  #mg-header .mg-mobile a {
    position: relative;
    color: var(--mg-text) !important;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1;
    padding: 8px 0;
    white-space: nowrap;
    transition: color 0.3s ease;
  }
  #mg-header .mg-nav a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--mg-green) 0 34%, var(--mg-blue) 34% 67%, var(--mg-orange) 67% 100%);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.4s var(--mg-ease);
  }
  #mg-header .mg-nav a:hover {
    color: var(--mg-green-dark) !important;
  }
  #mg-header .mg-nav a:hover::after,
  #mg-header .mg-nav a.is-active::after {
    transform: scaleX(1);
  }
  #mg-header .mg-nav a:focus-visible,
  #mg-header .mg-logo:focus-visible,
  #mg-header .mg-burger:focus-visible {
    outline: 2px solid var(--mg-green);
    outline-offset: 4px;
    border-radius: 4px;
  }
  #mg-header .mg-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-right: auto;
    transform-origin: left center;
    transition: transform 0.45s var(--mg-ease);
  }
  #mg-header .mg-logo-mark {
    display: block;
    height: 36px;
    aspect-ratio: 289 / 201;
    background: url("https://files.greatpages.com.br/images/67944/9Iw5ZBJHK4jI1u1fk3BdZZsd.webp") 50% 0 / 180.3% auto no-repeat;
    transition: transform 0.6s var(--mg-ease);
  }
  #mg-header .mg-logo-name {
    display: block;
    width: auto;
    height: 19px;
    max-width: none;
  }
  #mg-header .mg-logo:hover .mg-logo-mark {
    transform: translateY(-1px) rotate(-3deg);
  }
  #mg-header.is-scrolled .mg-bar {
    height: 54px;
    --mg-bg: rgba(246, 245, 240, 0.86);
    box-shadow: 0 6px 18px rgba(20, 35, 25, 0.08);
  }
  #mg-header.is-scrolled .mg-logo {
    transform: scale(0.88);
  }
  #mg-header .mg-burger {
    display: none;
  }
  #mg-header .mg-mobile {
    display: none;
  }
  @media (max-width: 900px) {
    #mg-header {
      --mg-bar-h: 56px;
    }
    #mg-header .mg-nav {
      display: none;
    }
    #mg-header .mg-bar {
      padding: 0 16px;
    }
    #mg-header .mg-logo-mark {
      height: 30px;
    }
    #mg-header .mg-logo-name {
      height: 16px;
    }
    #mg-header.is-scrolled .mg-bar {
      height: 50px;
    }
    #mg-header .mg-burger {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 44px;
      height: 44px;
      margin-right: -10px;
      padding: 0 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #mg-header .mg-burger span {
      display: block;
      height: 2px;
      border-radius: 2px;
      background: var(--mg-text);
      transition:
        transform 0.35s var(--mg-ease),
        opacity 0.25s ease;
    }
    #mg-header .mg-toggle:checked ~ .mg-bar .mg-burger span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    #mg-header .mg-toggle:checked ~ .mg-bar .mg-burger span:nth-child(2) {
      opacity: 0;
    }
    #mg-header .mg-toggle:checked ~ .mg-bar .mg-burger span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }
    #mg-header .mg-mobile {
      display: flex;
      flex-direction: column;
      position: absolute;
      z-index: 1;
      top: 100%;
      left: 0;
      right: 0;
      padding: 12px 24px 22px;
      background: var(--mg-bg-solid);
      border-radius: 0 0 22px 22px;
      box-shadow: 0 18px 30px rgba(20, 35, 25, 0.16);
      pointer-events: none;
      opacity: 0;
      transform: translateY(-12px);
      visibility: hidden;
      transition:
        opacity 0.35s var(--mg-ease),
        transform 0.35s var(--mg-ease),
        visibility 0s linear 0.35s;
    }
    #mg-header .mg-mobile a {
      font-size: 17px;
      padding: 15px 4px;
      border-bottom: 1px solid rgba(31, 42, 34, 0.1);
    }
    #mg-header .mg-mobile a:last-child {
      border-bottom: 0;
    }
    #mg-header .mg-toggle:checked ~ .mg-mobile {
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
      transition:
        opacity 0.35s var(--mg-ease),
        transform 0.35s var(--mg-ease),
        visibility 0s;
    }
  }
  #site {
    padding-top: 62px !important;
  }
  @media (max-width: 900px) {
    #site {
      padding-top: 56px !important;
    }
  }
  html {
    scroll-padding-top: 80px;
  }
</style>
<script>
  (function () {
    function init() {
      var header = document.getElementById("mg-header");
      if (!header) return;
      if (header.parentNode !== document.body) document.body.appendChild(header);

      var toggle = header.querySelector("#mg-toggle");
      var bar = header.querySelector(".mg-bar");
      var ticking = false;
      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          header.classList.toggle("is-scrolled", window.scrollY > 40);
          ticking = false;
        });
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();

      var links = header.querySelectorAll('a[href^="#"]');
      links.forEach(function (a) {
        a.addEventListener("click", function (e) {
          var id = a.getAttribute("href");
          if (toggle) toggle.checked = false;
          if (id === "#inicio" || id === "#") {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: "smooth" });
            return;
          }
          var target = document.querySelector(id);
          if (!target) return;
          e.preventDefault();
          var offset = bar.offsetHeight + 16;
          var y = target.getBoundingClientRect().top + window.scrollY - offset;
          window.scrollTo({ top: y, behavior: "smooth" });
        });
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && toggle) toggle.checked = false;
      });
      document.addEventListener("click", function (e) {
        if (toggle && toggle.checked && !header.contains(e.target)) toggle.checked = false;
      });
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
</script>
